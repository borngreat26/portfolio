<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meta</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body class="meta-page">
    <main>
      <header>
        <h1 class="Meta">Meta</h1>
        <p>This page includes stats about the code of this website.</p>
      </header>

      <!-- Time Slider UI
      <div style="display: flex; align-items: baseline; gap:1em; margin-bottom:1em;">
        <label for="commit-progress" style="flex:1; display:flex; gap:0.5em; align-items:baseline;">
          Show commits until:
          <input
            type="range"
            id="commit-progress"
            min="0"
            max="100"
            value="100"
            style="width:100%;"
          />
        </label>
        <time id="commit-time" style="margin-left: auto;"></time>

      <section id="summary-stats">
        <div id="stats"></div>
      </section>

      <div id="scrolly-1">
        <div id="scatter-story">some filler text here</div>
        <div id="scatter-plot">
          <h2>Commits by time of day</h2>
          <div id="chart"></div>
      
          <dl id="commit-tooltip" class="info tooltip" hidden>
            <dt>Commit</dt>
            <dd><a href="" id="commit-link" target="_blank"></a></dd>
            <dt>Date</dt>
            <dd id="commit-date"></dd>
            <dt>Time</dt>
            <dd id="commit-time-detail"></dd>
            <dt>Author</dt>
            <dd id="commit-author"></dd>
            <dt>Lines edited</dt>
            <dd id="commit-lines"></dd>
          </dl>
      
          <p id="selection-count">No commits selected</p>
          <dl id="language-breakdown" class="stats"></dl>
        </div>
      </div>

      <div id="scrolly-2">
        <div id="files-story"></div>
        <dl id="files"></dl>
      </div>
      
    </main>

    <!-- JavaScript Modules -->
    <script type="module" src="../global.js"></script>
    <script type="module" src="meta.js" defer></script>
  </body>
</html>
